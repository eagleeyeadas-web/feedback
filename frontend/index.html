    <!-- Immediate Path-to-Hash Router Bridge for Direct Navigation & Mobile Push Notification Clicks -->
    <script>
      (function() {
        try {
          var p = window.location.pathname;
          if (p && p !== '/' && !p.startsWith('/assets/') && !p.startsWith('/api/') && !p.includes('.')) {
            var search = window.location.search || '';
            var hash = window.location.hash || '';
            if (!hash || hash === '#' || hash === '#/') {
              window.location.replace('/#' + p + search);
            }
          }
        } catch (e) {}
      })();
    </script>
    <title>Eagle Eye SafDrive - Customer Feedback</title>
